<body><header><a href="./">通常の業務アプリへ</a><span>P078 起動試作</span></header><main><p id="trialStatus" role="status">保存された本人確認情報を確認しています…</p><section id="ownCard" aria-label="本人カード" hidden><h1 id="cardName"></h1><p id="cardFreshness" role="status"></p><p id="cardLabel"></p><h2>行先</h2><p id="cardPlace"></p><h2>作業内容</h2><p id="cardWork"></p></section><p class="note">最初の1回は接続を準備します。次回からは利用権限を確認して前回のカードを表示し、最新の行先を取得します。初回表示と最新確認の時間を別々に測ります。</p><p class="note"><a href="./startup-refresh.html?v=P079-ENTRY-1" target="_self">次の起動試作（P079）を開く</a><br><small>P079への更新が完了してから開いてください。</small></p><div class="buttons"><button id="copyReport" type="button">計測結果をコピー</button><button id="retry" type="button">もう一度計測</button><button id="forgetTrial" type="button">試作のログインだけ解除</button></div><p id="copyStatus" role="status"></p><details><summary>共有用の計測結果</summary><p class="note">個人情報・接続用の情報は含みません。入口の読み込み開始からの秒数です。画面を離れるとカードを閉じます。</p><textarea id="trialReport" readonly aria-label="共有用の計測結果"></textarea></details><p class="note"><a href="./startup-direct.html?v=P077-ENTRY-2">前の試作（P077）を開く</a></p></main></body></html>
