<body><header><a href="./">通常の業務アプリへ</a><span>P081 起動試作</span></header><main><p id="trialStatus" role="status">保存された本人確認情報を確認しています…</p><section id="ownCard" aria-label="本人カード" hidden><h1 id="cardName"></h1><p id="cardFreshness" role="status"></p><p id="cardLabel"></p><h2>行先</h2><p id="cardPlace"></p><h2>作業内容</h2><p id="cardWork"></p></section><p class="note">同期済みの行先を表示します。通常は1分ごとに確認し、変更や通信状況により反映が遅れることがあります。確認時刻をカードに表示します。同期切れや予定の切り替わり時は再確認します。</p><div class="buttons"><button id="copyReport" type="button">計測結果をコピー</button><button id="retry" type="button">もう一度計測</button><button id="measureRefresh" type="button">再同期を計測</button><button id="forgetTrial" type="button">試作のログインだけ解除</button></div><p id="copyStatus" role="status"></p><details><summary>共有用の計測結果</summary><p class="note">個人情報・接続用の情報は含みません。入口の読み込み開始からの秒数です。画面を離れるとカードを閉じます。</p><textarea id="trialReport" readonly aria-label="共有用の計測結果"></textarea></details><p class="note"><a href="./startup-card.html?v=P080-ENTRY-1">前の試作（P080）を開く</a></p></main></body></html>
